[project]
name = "wd_fw_update"
version = "2.3.0"
description = "Updates the firmware of Western Digital SSDs"
requires-python = ">=3.8"
dependencies = [
    "inquirer >=3,<4",
    "requests >=2.2,<3"
]

[project.scripts]
run = "wd_fw_update.main:run"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
